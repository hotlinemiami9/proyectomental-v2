name: Bug report
description: Report a reproducible problem
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include birth data, credentials, tokens, or personal information in this issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, staging or production
